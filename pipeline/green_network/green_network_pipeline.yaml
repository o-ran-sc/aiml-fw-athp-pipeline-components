      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_storage_for_green_network
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.28.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.3'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_storage_for_green_network(\n    model_input: Input[Model],\n\
          \    training_job_name: str,\n    version: str,\n    s3_endpoint: str,\n\
          \    s3_access_key: str,\n    s3_secret_key: str,\n    s3_bucket: str,\n\
          \    train_rmse: float,\n    test_rmse: float,\n    co2_emissions_kg: float\n\
          ) -> NamedTuple('Outputs', [('model_url', str), ('model_size_mb', float)]):\n\
          \    import boto3\n    import json\n    from collections import namedtuple\n\
          \    import traceback\n\n    try:\n        # Model Input\uC5D0\uC11C S3\
          \ \uACBD\uB85C \uC77D\uAE30\n        with open(model_input.path, 'r') as\
          \ f:\n            s3_path = f.read().strip()\n\n        print(f\"Model S3\
          \ path: {s3_path}\")\n\n        # S3 \uACBD\uB85C \uD30C\uC2F1 (s3://bucket/key)\n\
          \        if not s3_path.startswith('s3://'):\n            raise ValueError(f\"\
          Invalid S3 path: {s3_path}\")\n\n        # s3://ml-models/green-network/models/...model.pth\
          \ \uC5D0\uC11C key \uCD94\uCD9C\n        s3_key = s3_path.replace(f\"s3://{s3_bucket}/\"\
          , \"\")\n\n        # S3 Client \uC0DD\uC131\n        s3_client = boto3.client(\n\
          \            's3',\n            endpoint_url=s3_endpoint,\n            aws_access_key_id=s3_access_key,\n\
          \            aws_secret_access_key=s3_secret_key\n        )\n\n        #\
          \ \uBAA8\uB378 \uD30C\uC77C \uD06C\uAE30 \uD655\uC778\n        response\
          \ = s3_client.head_object(Bucket=s3_bucket, Key=s3_key)\n        model_size_bytes\
          \ = response['ContentLength']\n        model_size_mb = model_size_bytes\
          \ / (1024 * 1024)\n\n        print(f\"Model size: {model_size_mb:.2f} MB\"\
          )\n\n        # Metadata \uC0DD\uC131\n        metadata = {\n           \
          \ 'training_job_name': training_job_name,\n            'version': version,\n\
          \            'model_type': 'LSTM',\n            'framework': 'PyTorch',\n\
          \            'metrics': {\n                'train_rmse': train_rmse,\n \
          \               'test_rmse': test_rmse,\n                'co2_emissions_kg':\
          \ co2_emissions_kg\n            },\n            'model_size_mb': model_size_mb,\n\
          \            'model_s3_path': s3_path\n        }\n\n        # Metadata\uB97C\
          \ S3\uC5D0 \uC5C5\uB85C\uB4DC\n        metadata_key = f\"green-network/models/{training_job_name}/{version}/metadata.json\"\
          \n        metadata_json = json.dumps(metadata, indent=2)\n        s3_client.put_object(\n\
          \            Bucket=s3_bucket,\n            Key=metadata_key,\n        \
          \    Body=metadata_json.encode('utf-8'),\n            ContentType='application/json'\n\
          \        )\n\n        print(f\"Metadata saved to: s3://{s3_bucket}/{metadata_key}\"\
          )\n        print(f\"Model URL: {s3_path}\")\n\n        Outputs = namedtuple('Outputs',\
          \ ['model_url', 'model_size_mb'])\n        return Outputs(model_url=s3_path,\
          \ model_size_mb=model_size_mb)\n\n    except Exception as e:\n        print(f\"\
          Error in model storage: {e}\")\n        print(traceback.format_exc())\n\
          \        raise\n\n"
        image: python:3.11-slim
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 2.147483648
          memoryRequest: 1.073741824
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 2Gi
          resourceMemoryRequest: 1Gi
