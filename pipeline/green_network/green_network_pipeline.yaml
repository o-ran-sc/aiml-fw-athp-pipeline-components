        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_extraction_for_green_network
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'influxdb-client==1.38.0'\
          \ 'pandas==2.1.0' 'boto3==1.28.0' 'numpy==1.24.3'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.14.3' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_extraction_for_green_network(\n    training_job_name:\
          \ str,\n    influxdb_url: str,\n    influxdb_token: str,\n    influxdb_org:\
          \ str,\n    influxdb_bucket: str,\n    s3_endpoint: str,\n    s3_access_key:\
          \ str,\n    s3_secret_key: str,\n    s3_bucket: str,\n    features_csv:\
          \ Output[Dataset],\n    cell_name: Optional[str] = None,\n    time_range_days:\
          \ int = 30\n) -> dict:\n    import pandas as pd\n    import numpy as np\n\
          \    from influxdb_client import InfluxDBClient\n    import boto3\n    from\
          \ datetime import datetime, timedelta\n    import traceback\n\n    try:\n\
          \        # ---------------------------\n        # Connect to InfluxDB\n\
          \        # ---------------------------\n        client = InfluxDBClient(\n\
          \            url=influxdb_url,\n            token=influxdb_token,\n    \
          \        org=influxdb_org\n        )\n        query_api = client.query_api()\n\
          \n        # ---------------------------\n        # Build Flux query\n  \
          \      # ---------------------------\n        time_range = f\"-{time_range_days}d\"\
          \n        cell_filter = \"\"\n        if cell_name:\n            cell_filter\
          \ = f'|> filter(fn: (r) => r[\"Viavi.Cell.Name\"] == \"{cell_name}\")'\n\
          \n        flux_query = f'''\n        from(bucket: \"{influxdb_bucket}\"\
          )\n            |> range(start: {time_range})\n            |> filter(fn:\
          \ (r) => r[\"_measurement\"] == \"cell_metrics\")\n            |> filter(fn:\
          \ (r) => r[\"_field\"] == \"RRU.PrbUsedDl\")\n            {cell_filter}\n\
          \            |> sort(columns: [\"_time\"])\n            |> keep(columns:\
          \ [\"_time\", \"_value\", \"Viavi.Cell.Name\"])\n        '''\n\n       \
          \ # ---------------------------\n        # Query & process dataframe\n \
          \       # ---------------------------\n        result = query_api.query_data_frame(flux_query)\n\
          \        client.close()\n\n        if result.empty:\n            raise ValueError(\"\
          No data returned from InfluxDB\")\n\n        df = result.rename(columns={\n\
          \            '_time': 'timestamp',\n            '_value': 'RRU.PrbUsedDl',\n\
          \            'Viavi.Cell.Name': 'cell_name'\n        })[['timestamp', 'RRU.PrbUsedDl']]\n\
          \n        df = df.sort_values('timestamp').reset_index(drop=True)\n    \
          \    df = df[df.index % 30 == 0].reset_index(drop=True)  # downsampling\n\
          \n        # Fill missing values if any\n        if df['RRU.PrbUsedDl'].isna().sum()\
          \ > 0:\n            df['RRU.PrbUsedDl'].fillna(method='ffill', inplace=True)\n\
          \            df['RRU.PrbUsedDl'].fillna(method='bfill', inplace=True)\n\n\
          \        # ---------------------------\n        # Save to CSV and upload\
          \ to S3\n        # ---------------------------\n        local_csv_path =\
          \ f\"/tmp/{training_job_name}_features.csv\"\n        df.to_csv(local_csv_path,\
          \ index=False)\n\n        s3_client = boto3.client(\n            's3',\n\
          \            endpoint_url=s3_endpoint,\n            aws_access_key_id=s3_access_key,\n\
          \            aws_secret_access_key=s3_secret_key\n        )\n        s3_key\
          \ = f\"green-network/features/{training_job_name}_features.csv\"\n     \
          \   s3_client.upload_file(local_csv_path, s3_bucket, s3_key)\n        s3_path\
          \ = f\"s3://{s3_bucket}/{s3_key}\"\n\n        import shutil\n        shutil.copy(local_csv_path,\
          \ features_csv.path)\n\n        # ---------------------------\n        #\
          \ Return metadata\n        # ---------------------------\n        return\
          \ {\n            'num_samples': int(len(df)),\n            'features': ['RRU.PrbUsedDl'],\n\
          \            'csv_path': s3_path,\n            'time_range': f\"{df['timestamp'].min()}\
          \ to {df['timestamp'].max()}\",\n            'statistics': {\n         \
          \       'mean': float(df['RRU.PrbUsedDl'].mean()),\n                'std':\
          \ float(df['RRU.PrbUsedDl'].std()),\n                'min': float(df['RRU.PrbUsedDl'].min()),\n\
          \                'max': float(df['RRU.PrbUsedDl'].max())\n            }\n\
          \        }\n\n    except Exception as e:\n        print(f\"Error in feature\
          \ extraction: {e}\")\n        print(traceback.format_exc())\n        raise\n\
          \n"
        image: python:3.11-slim
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 2.147483648
          memoryRequest: 1.073741824
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 2Gi
          resourceMemoryRequest: 1Gi
    exec-metrics-store-for-green-network:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - metrics_store_for_green_network
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'cassandra-driver==3.29.1'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.3'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef metrics_store_for_green_network(\n    training_job_name: str,\n\
          \    version: str,\n    cassandra_host: str,\n    cassandra_port: int,\n\
          \    cassandra_username: str,\n    cassandra_password: str,\n    cassandra_keyspace:\
          \ str,\n    train_rmse: float,\n    test_rmse: float,\n    training_time:\
          \ float,\n    ram_energy_kwh: float,\n    cpu_energy_kwh: float,\n    gpu_energy_kwh:\
          \ float,\n    co2_emissions_kg: float\n):\n    from cassandra.cluster import\
          \ Cluster\n    from cassandra.auth import PlainTextAuthProvider\n    from\
          \ datetime import datetime\n    import traceback\n\n    try:\n        auth_provider\
          \ = PlainTextAuthProvider(\n            username=cassandra_username,\n \
          \           password=cassandra_password\n        )\n        cluster = Cluster(\n\
          \            [cassandra_host],\n            port=cassandra_port,\n     \
          \       auth_provider=auth_provider\n        )\n        session = cluster.connect(cassandra_keyspace)\n\
          \n        create_table_cql = f\"\"\"\n        CREATE TABLE IF NOT EXISTS\
          \ {cassandra_keyspace}.green_network_metrics (\n            training_job_name\
          \ TEXT,\n            version TEXT,\n            timestamp TIMESTAMP,\n \
          \           metric_type TEXT,\n            metric_name TEXT,\n         \
          \   metric_value DOUBLE,\n            PRIMARY KEY ((training_job_name, version),\
          \ timestamp, metric_type, metric_name)\n        ) WITH CLUSTERING ORDER\
          \ BY (timestamp DESC, metric_type ASC, metric_name ASC);\n        \"\"\"\
          \n        session.execute(create_table_cql)\n\n        timestamp = datetime.now()\n\
          \        metrics = [\n            ('performance', 'train_rmse', train_rmse),\n\
          \            ('performance', 'test_rmse', test_rmse),\n            ('energy',\
          \ 'ram_energy_kwh', ram_energy_kwh),\n            ('energy', 'cpu_energy_kwh',\
          \ cpu_energy_kwh),\n            ('energy', 'gpu_energy_kwh', gpu_energy_kwh),\n\
          \            ('energy', 'total_energy_kwh', ram_energy_kwh + cpu_energy_kwh\
          \ + gpu_energy_kwh),\n            ('carbon', 'co2_emissions_kg', co2_emissions_kg),\n\
          \            ('carbon', 'co2_emissions_g', co2_emissions_kg * 1000),\n \
          \           ('time', 'training_time_seconds', training_time),\n        \
          \    ('time', 'training_time_minutes', training_time / 60)\n        ]\n\n\
          \        insert_cql = f\"\"\"\n        INSERT INTO {cassandra_keyspace}.green_network_metrics\
          \ \n        (training_job_name, version, timestamp, metric_type, metric_name,\
          \ metric_value)\n        VALUES (?, ?, ?, ?, ?, ?)\n        \"\"\"\n   \
          \     prepared = session.prepare(insert_cql)\n\n        for metric_type,\
          \ metric_name, metric_value in metrics:\n            session.execute(prepared,\
          \ (\n                training_job_name,\n                version,\n    \
          \            timestamp,\n                metric_type,\n                metric_name,\n\
          \                float(metric_value)\n            ))\n\n        cluster.shutdown()\n\
          \n    except Exception as e:\n        print(f\"Error in metrics store: {e}\"\
          )\n        print(traceback.format_exc())\n        raise\n\n"
        image: python:3.11-slim
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 1.073741824
          memoryRequest: 0.536870912
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 1Gi
          resourceMemoryRequest: 512Mi
