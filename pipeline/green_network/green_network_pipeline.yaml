          \ python3 -m pip install --quiet --no-warn-script-location 'torch==2.2.0'\
          \ 'numpy==1.24.3' 'pandas==2.1.0' 'boto3==1.28.0' 'codecarbon==2.3.5' 'scikit-learn==1.3.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.3'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_training_for_green_network(\n    features_csv: Input[Dataset],\n\
          \    training_job_name: str,\n    s3_endpoint: str,\n    s3_access_key:\
          \ str,\n    s3_secret_key: str,\n    s3_bucket: str,\n    model_output:\
          \ Output[Model],\n    sequence_length: int = 24,\n    epochs: int = 50,\n\
          \    batch_size: int = 32,\n    learning_rate: float = 0.003,\n    train_split_ratio:\
          \ float = 0.7\n) -> NamedTuple(\"Outputs\", [\n    (\"train_rmse\", float),\n\
          \    (\"test_rmse\", float),\n    (\"training_time\", float),\n    (\"ram_energy_kwh\"\
          , float),\n    (\"cpu_energy_kwh\", float),\n    (\"gpu_energy_kwh\", float),\n\
          \    (\"co2_emissions_kg\", float),\n]):\n    import os\n    import time\n\
          \    import pandas as pd\n    import numpy as np\n    import torch\n   \
          \ import torch.nn as nn\n    from torch.utils.data import DataLoader, TensorDataset\n\
          \    from sklearn.preprocessing import MinMaxScaler\n    from sklearn.metrics\
          \ import mean_squared_error\n    import boto3\n    from codecarbon import\
          \ EmissionsTracker\n\n    local_csv = features_csv.path\n    df = pd.read_csv(local_csv)\n\
          \    data = df['RRU.PrbUsedDl'].values.reshape(-1, 1)\n    scaler = MinMaxScaler()\n\
          \    scaled_data = scaler.fit_transform(data)\n\n    def create_sequences(data,\
          \ seq_len):\n        xs, ys = [], []\n        for i in range(len(data) -\
          \ seq_len):\n            xs.append(data[i:(i + seq_len)])\n            ys.append(data[i\
          \ + seq_len])\n        return np.array(xs), np.array(ys)\n\n    X, y = create_sequences(scaled_data,\
          \ sequence_length)\n    split_idx = int(len(X) * train_split_ratio)\n  \
          \  X_train, X_test = X[:split_idx], X[split_idx:]\n    y_train, y_test =\
          \ y[:split_idx], y[split_idx:]\n\n    X_train_t = torch.tensor(X_train,\
          \ dtype=torch.float32)\n    y_train_t = torch.tensor(y_train, dtype=torch.float32)\n\
          \    X_test_t = torch.tensor(X_test, dtype=torch.float32)\n    y_test_t\
          \ = torch.tensor(y_test, dtype=torch.float32)\n    train_loader = DataLoader(TensorDataset(X_train_t,\
          \ y_train_t), batch_size=batch_size, shuffle=True)\n\n    class LSTMModel(nn.Module):\n\
          \        def __init__(self, input_size=1, hidden_size=64, num_layers=2):\n\
          \            super().__init__()\n            self.lstm = nn.LSTM(input_size,\
          \ hidden_size, num_layers, batch_first=True)\n            self.fc = nn.Linear(hidden_size,\
          \ 1)\n        def forward(self, x):\n            out, _ = self.lstm(x)\n\
          \            out = self.fc(out[:, -1, :])\n            return out\n\n  \
          \  device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\"\
          )\n    model = LSTMModel().to(device)\n    criterion = nn.MSELoss()\n  \
          \  optimizer = torch.optim.Adam(model.parameters(), lr=learning_rate)\n\n\
          \    tracker = EmissionsTracker(project_name=training_job_name, measure_power_secs=1)\n\
          \    tracker.start()\n\n    start_time = time.time()\n    for epoch in range(epochs):\n\
          \        model.train()\n        for batch_x, batch_y in train_loader:\n\
          \            batch_x, batch_y = batch_x.to(device), batch_y.to(device)\n\
          \            optimizer.zero_grad()\n            pred = model(batch_x)\n\
          \            loss = criterion(pred, batch_y)\n            loss.backward()\n\
          \            optimizer.step()\n    end_time = time.time()\n    duration\
          \ = end_time - start_time\n    emissions = tracker.stop()\n\n    model.eval()\n\
          \    with torch.no_grad():\n        preds = model(X_test_t.to(device)).cpu().numpy()\n\
          \        y_true = y_test_t.cpu().numpy()\n        test_rmse_val = float(mean_squared_error(y_true,\
          \ preds, squared=False))\n    train_rmse_val = float(loss.item())\n\n  \
          \  model_path = f\"/tmp/{training_job_name}_model.pth\"\n    torch.save(model.state_dict(),\
          \ model_path)\n\n    s3_client = boto3.client(\n        's3',\n        endpoint_url=s3_endpoint,\n\
          \        aws_access_key_id=s3_access_key,\n        aws_secret_access_key=s3_secret_key\n\
          \    )\n    s3_key = f\"green-network/models/{training_job_name}/model.pth\"\
          \n    s3_client.upload_file(model_path, s3_bucket, s3_key)\n\n    with open(model_output.path,\
          \ \"w\") as f:\n        f.write(f\"s3://{s3_bucket}/{s3_key}\")\n\n    ram_energy_kwh_val\
          \ = float(getattr(emissions, \"ram_energy\", 0.0))\n    cpu_energy_kwh_val\
          \ = float(getattr(emissions, \"cpu_energy\", 0.0))\n    gpu_energy_kwh_val\
          \ = float(getattr(emissions, \"gpu_energy\", 0.0))\n    co2_emissions_kg_val\
          \ = float(getattr(emissions, \"emissions\", 0.0))\n\n    return (\n    \
          \    train_rmse_val,\n        test_rmse_val,\n        duration,\n      \
          \  ram_energy_kwh_val,\n        cpu_energy_kwh_val,\n        gpu_energy_kwh_val,\n\
          \        co2_emissions_kg_val,\n    )\n\n"
        image: python:3.11-slim
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 2.147483648
          memoryRequest: 1.073741824
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 2Gi
          resourceMemoryRequest: 1Gi
